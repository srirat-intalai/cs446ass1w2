        /* ตั้งค่าพื้นหลังหน้าเว็บเป็นโทนเขียวน้ำทะเลเข้ม */
        body {
            background-color: #0e1e20;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        /* กล่องการ์ดหลักตรงกลาง */
        .card-box {
            width: 780px;
            background-color: #1a3235;
            padding: 45px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
            border: 1px solid #284c50;
        }

        /* หัวข้อ Server Identity สีเขียวน้ำทะเลสว่าง */
        .main-title {
            text-align: center;
            color: #36d7b7;
            font-size: 38px;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .sub-title {
            text-align: center;
            color: #7ba8a0;
            font-size: 16px;
            margin-bottom: 40px;
        }

        /* ตารางแบ่งข้อมูล 4 ช่อง */
        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 35px;
        }

        /* กล่องย่อยใส่ข้อมูลแต่ละช่อง */
        .info-card {
            background-color: #122426;
            padding: 22px 25px;
            border-radius: 14px;
            border: 1px solid #1f3c3f;
        }

        .info-label {
            font-size: 11px;
            color: #61948c;
            font-weight: bold;
            letter-spacing: 1.5px;
            margin-bottom: 8px;
        }

        .info-value {
            font-size: 20px;
            color: #e6f7f5;
            font-weight: 600;
        }

        /* ส่วนแสดง Document Root ด้านล่าง */
        .path-section {
            border-left: 4px solid #36d7b7;
            padding-left: 18px;
            margin-top: 10px;
        }

        .path-label {
            color: #36d7b7;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }

        .path-text {
            color: #36d7b7;
            font-size: 22px;
            font-weight: bold;
            font-family: 'Courier New', Courier, monospace;
        }
    </style>
</head>
<body>

    <!-- การ์ดแสดงข้อมูลเซิร์ฟเวอร์ -->
    <div class="card-box">
        
        <div class="main-title">Server Identity</div>
        <div class="sub-title">Cloud Infrastructure & EBS Management</div>

        <!-- กล่องข้อมูล 4 ช่อง -->
        <div class="info-grid">
            <div class="info-card">
                <div class="info-label">STUDENT NAME</div>
                <div class="info-value">Srirat Intalai</div>
            </div>

            <div class="info-card">
                <div class="info-label">STUDENT ID</div>
                <div class="info-value">1660705185</div>
            </div>

            <div class="info-card">
                <div class="info-label">MACHINE ID</div>
                <div class="info-value">Machine-111</div>
            </div>

            <div class="info-card">
                <div class="info-label">EBS DISK SIZE</div>
                <div class="info-value">85 GB</div>
            </div>
        </div>

        <!-- โซนแสดง Document Root -->
        <div class="path-section">
            <div class="path-label">📁 DOCUMENT ROOT (CURRENT WEB PATH)</div>
            <div class="path-text">/data1660705185</div>
        </div>

    </div>

</body>
